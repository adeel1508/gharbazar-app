name: Build and release APK

# Every push to main builds the release APK, publishes it as a GitHub
# Release, and updates Firestore app_config/version so the installed app
# sees "Update available" on next launch. Free on GitHub's runners for a
# public repo. No Play Store involvement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from run number
        id: version
        run: |
          echo "version_code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages list ("tools platform-tools")
          # is stale: the old "tools" SDK package no longer exists in
          # Google's repository, so sdkmanager fails with "Failed to
          # find package 'tools'" (run #1, 2026-11-24). Install only
          # packages that exist; the runner image already ships most
          # SDK components, sdkmanager skips those already installed.
          packages: platform-tools build-tools;36.0.0 platforms;android-36

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/gharbazar-release.keystore"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/gharbazar-release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionCode=${{ steps.version.outputs.version_code }} -PappVersionName=${{ steps.version.outputs.version_name }} --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      apk_url: ${{ steps.release.outputs.apk_url }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.build.outputs.version_name }}"
          gh release create "$TAG" apk/app-release.apk --title "GharBazar $TAG" --notes "Automatic build from main (run ${{ github.run_number }}). Install over the previous version to update." --latest
          echo "apk_url=https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk" >> "$GITHUB_OUTPUT"

  update-firestore:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update app_config/version in Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          APK_URL: ${{ needs.release.outputs.apk_url }}
        run: |
          pip install --quiet google-auth
          python3 .github/scripts/update_firestore_version.py
